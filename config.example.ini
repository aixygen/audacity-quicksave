# Copy to ~/.config/audacity-quicksave/config.ini to change the defaults.

[main]
# How many backups to keep (oldest are deleted). 0 keeps them all.
keep_backups = 20

# Where backups of the previous versions are stored.
backup_dir = ~/.local/state/audacity-quicksave/backups

# Show desktop notifications (yes/no).
notifications = yes
